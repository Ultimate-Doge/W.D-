<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 1 - Egg Room</title>
    <style>
        /* Sets up your custom background asset scene */
        body {
            margin: 0;
            height: 100vh;
            background-color: #050505;
            background-image: url('../Assets/Egg_Background.png'); /* Paths adjust to go out of egg folder into Assets */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: monospace;
        }

        /* Persistent Inventory HUD in the top left corner */
        #inventory-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 10;
        }

        .hud-item {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.05);
            opacity: 0.15;
            transition: opacity 0.5s ease;
            border: 1px dashed rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        .hud-item.collected {
            opacity: 1;
            border-style: solid;
            box-shadow: 0 0 10px #fff;
            background-color: rgba(255,255,255,0.2);
        }

        /* The Interactive Canvas Area */
        .game-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Clickable custom tree object */
        #game-tree {
            width: 280px;
            height: auto;
            cursor: pointer;
            z-index: 3;
            user-select: none;
            transition: transform 0.1s ease;
        }

        #game-tree.hidden {
            display: none;
        }

        /* Pure structural physical layout for the hidden spawning egg */
        #spawned-egg {
            position: absolute;
            width: 60px;
            height: 75px;
            background-color: #fff;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 0 0 10px rgba(255,255,255,0.5);
            z-index: 2;
            opacity: 0;
            pointer-events: none;
        }

        /* SLOW FLIGHT ENGINE CONFIGURATION (Adjusted down to 4.5 seconds) */
        .egg-flying {
            opacity: 1 !important;
            transition: transform 4.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 4.5s ease;
            transform: translate(-120vw, -100px) rotate(-360deg) !important;
        }

        /* Custom graphic TextBox asset panel at the base */
        .textbox-container {
            position: absolute;
            bottom: 40px;
            width: 600px;
            height: 130px;
            background-image: url('../Assets/Text_Box.png'); /* Maps your Text_Box image asset */
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #dialogue-text {
            color: #ffffff;
            font-size: 1.3rem;
            text-align: center;
            width: 90%;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="inventory-hud">
        <div id="hud-egg" class="hud-item">🥚</div>
    </div>

    <div class="game-stage">
        <!-- Renders your custom tree image asset directly -->
        <img id="game-tree" src="../Assets/Tree.png" alt="Tree">
        <div id="spawned-egg"></div> 
    </div>

    <!-- The custom background text box wrapper -->
    <div id="msg-box" class="textbox-container">
        <div id="dialogue-text"></div>
    </div>

    <audio id="bg-ambient" src="../Assets/Fgg_Sound.mp3" loop></audio>
    <audio id="item-sfx" src="../Assets/item.mp3"></audio>

    <script>
        const tree = document.getElementById('game-tree');
        const eggItem = document.getElementById('spawned-egg');
        const msgBox = document.getElementById('msg-box');
        const txtOutput = document.getElementById('dialogue-text');
        const hudEgg = document.getElementById('hud-egg');
        
        const ambientAudio = document.getElementById('bg-ambient');
        const rewardAudio = document.getElementById('item-sfx');

        document.body.addEventListener('click', () => {
            if (ambientAudio.paused) {
                ambientAudio.play().catch(err => console.log("Audio delayed..."));
            }
        }, { once: true });

        function verifyInventoryStatus() {
            if (localStorage.getItem('collected_egg') === 'true') {
                hudEgg.classList.add('collected');
                tree.classList.add('hidden');
                eggItem.style.display = 'none';
            } else {
                hudEgg.classList.remove('collected');
                tree.classList.remove('hidden');
                eggItem.style.display = 'block';
                eggItem.classList.remove('egg-flying');
                eggItem.style.opacity = '0';
                msgBox.style.opacity = '0';
            }
        }

        tree.addEventListener('click', () => {
            if (localStorage.getItem('collected_egg') === 'true') return;

            // Phase 1: Custom Text Box appears and displays the line instantly
            msgBox.style.opacity = '1';
            txtOutput.textContent = "Well, there is a man here.";

            // Phase 2: Show the egg stationary in the center behind the tree
            eggItem.style.opacity = '1';
            
            // Phase 3: Wait 1 second (1000ms delay) before letting it drift slowly off screen
            setTimeout(() => {
                eggItem.classList.add('egg-flying');
            }, 1000);

            // Phase 4: Wait out the full 4.5-second animation delay before playing pickup audio
            setTimeout(() => {
                localStorage.setItem('collected_egg', 'true');
                verifyInventoryStatus();
                rewardAudio.play();
            }, 5500); // 1000ms delay + 4500ms slide runtime = 5500ms total sequence block
        });

        verifyInventoryStatus();
    </script>

</body>
</html>
