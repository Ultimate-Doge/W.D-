<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrounded</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Central Player Base Styling */
        .player-sprite {
            position: absolute;
            z-index: 10;
            max-height: 120px; 
            image-rendering: pixelated;
            cursor: pointer;
        }

        /* DELTARUNE SOUL EXTRACTION PULSE (Persistent across all stages) */
        .deltarune-pulse {
            animation: deltaruneRedPulse 0.15s infinite ease-in-out;
        }

        /* STAGE 1: Horizontal-only shake */
        .horizontal-shake-slow {
            animation: hShakeSlow 0.05s infinite alternate, deltaruneRedPulse 0.15s infinite ease-in-out;
        }

        /* STAGE 3: Rapid horizontal structural shake */
        .horizontal-shake-rapid {
            animation: hShakeRapid 0.02s infinite alternate, deltaruneRedPulseIntense 0.06s infinite ease-in-out;
        }

        /* STRICT HORIZONTAL ONLY SHAKE KEYFRAMES */
        @keyframes hShakeSlow {
            0% { transform: translateX(4px); }
            100% { transform: translateX(-4px); }
        }

        @keyframes hShakeRapid {
            0% { transform: translateX(8px); }
            100% { transform: translateX(-8px); }
        }

        /* DELTARUNE STYLE RED GLOW FILTERS */
        @keyframes deltaruneRedPulse {
            0%, 100% { filter: drop-shadow(0 0 2px #ff0000) sepia(0.3) saturate(2) brightness(1); }
            50% { filter: drop-shadow(0 0 20px #ff0000) sepia(1) saturate(8) brightness(0.7); }
        }

        @keyframes deltaruneRedPulseIntense {
            0%, 100% { filter: drop-shadow(0 0 8px #ff0000) sepia(0.8) saturate(5) brightness(0.6); }
            50% { filter: drop-shadow(0 0 45px #ff0000) sepia(1) saturate(25) brightness(1.3); }
        }

        /* Soul Rings Configurations */
        .soul-ring {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .soul-sprite {
            position: absolute;
            width: 24px; 
            height: 24px;
            image-rendering: pixelated;
            transform-origin: center center; 
        }

        .spin-clockwise { animation: spinCW 25s infinite linear; }
        .spin-counterclockwise { animation: spinCCW 25s infinite linear; }

        @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <div id="scene-container">
        <img id="player-img" alt="Kris" class="player-sprite">
    </div>

    <script>
        // Foolproof path builder for subfolders
        const pathSegments = window.location.pathname.split('/').filter(s => s.length > 0);
        let repoBasePath = window.location.origin + '/';
        if (pathSegments.length > 1) {
            repoBasePath += pathSegments[0] + '/';
        }

        const krisIdleUrl = repoBasePath + 'Assets/Kris_Idle.png';
        const krisDownUrl = repoBasePath + 'Assets/Kris_Down.png';
        const soulAssetUrl = repoBasePath + 'Assets/Soul.png';

        const playerElement = document.getElementById('player-img');
        playerElement.src = krisIdleUrl;

        // Populate Spinning Soul Matrix
        const container = document.getElementById('scene-container');
        const ringSettings = [
            { radius: 130, count: 12 }, 
            { radius: 220, count: 20 }, 
            { radius: 310, count: 28 }, 
            { radius: 400, count: 36 }  
        ];

        ringSettings.forEach((ring, ringIndex) => {
            const ringElement = document.createElement('div');
            ringElement.classList.add('soul-ring');
            ringElement.classList.add(ringIndex % 2 === 0 ? 'spin-clockwise' : 'spin-counterclockwise');

            for (let i = 0; i < ring.count; i++) {
                const soul = document.createElement('img');
                soul.src = soulAssetUrl; 
                soul.classList.add('soul-sprite');
                const angleDegree = (i / ring.count) * 360;
                const angleRad = (angleDegree * Math.PI) / 180;
                const x = Math.cos(angleRad) * ring.radius;
                const y = Math.sin(angleRad) * ring.radius;
                const targetFacingRotation = angleDegree + 270;

                soul.style.transform = `translate(${x}px, ${y}px) rotate(${targetFacingRotation}deg)`;
                ringElement.appendChild(soul);
            }
            container.appendChild(ringElement);
        });

        // --- RESTORED TIMELINE CHOREOGRAPHY ENGINE ---
        let isPlayingSequence = false;

        playerElement.addEventListener('click', () => {
            if (isPlayingSequence) return;
            isPlayingSequence = true;

            // Note: The soul rings are NOT paused here; they will keep spinning through the entire event.

            // Stage 1: Shake horizontally and pulse red (Duration: 1.0 Second)
            playerElement.classList.add('horizontal-shake-slow');

            setTimeout(() => {
                // Stage 2: Stop shaking, but keep holding the red soul extraction pulse (Duration: 0.5 Seconds)
                playerElement.classList.remove('horizontal-shake-slow');
                playerElement.classList.add('deltarune-pulse');
                
                setTimeout(() => {
                    // Stage 3: Shake again, rapidly shaking horizontally while flashing intense red (Duration: 0.5 Seconds)
                    playerElement.classList.remove('deltarune-pulse');
                    playerElement.classList.add('horizontal-shake-rapid');

                    setTimeout(() => {
                        // Finale: Remove all active animation tags instantly and lock into the down state image
                        playerElement.classList.remove('horizontal-shake-rapid');
                        playerElement.src = krisDownUrl; 

                    }, 500); // 0.5 Seconds rapid burst (Stage 3)

                }, 500); // 0.5 Seconds middle rest gap (Stage 2)

            }, 1000); // 1.0 Second initial hit stage (Stage 1)
        });
    </script>

</body>
</html>
