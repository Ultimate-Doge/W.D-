<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrounded</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-sprite {
            position: absolute;
            z-index: 10;
            max-height: 120px; 
            image-rendering: pixelated;
        }

        .soul-ring {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .soul-sprite {
            position: absolute;
            width: 24px; 
            height: 24px;
            image-rendering: pixelated;
            transform-origin: center center; 
        }

        .spin-clockwise {
            animation: spinCW 25s infinite linear;
        }

        .spin-counterclockwise {
            animation: spinCCW 25s infinite linear;
        }

        @keyframes spinCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinCCW {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="scene-container">
        <!-- The player image src will be safely injected by JavaScript below -->
        <img id="player-img" alt="Kris" class="player-sprite">
    </div>

    <script>
        // DYNAMIC PATH SOLVER: Detects your exact GitHub site root URL automatically
        const pathArray = window.location.pathname.split('/');
        const repoName = pathArray[1]; // Gets your repository name
        const basePath = window.location.origin + '/' + repoName + '/';

        // Set the exact paths pointing back to the root Assets folder
        // CRITICAL: Double check if your folder on GitHub is "Assets" or "assets"!
        const playerAssetUrl = basePath + 'Assets/Kris_Idle.png';
        const soulAssetUrl = basePath + 'Assets/Soul.png';

        // Apply the resolved URL to Kris
        document.getElementById('player-img').src = playerAssetUrl;

        const container = document.getElementById('scene-container');
        
        const ringSettings = [
            { radius: 130, count: 12 }, 
            { radius: 220, count: 20 }, 
            { radius: 310, count: 28 }, 
            { radius: 400, count: 36 }  
        ];

        ringSettings.forEach((ring, ringIndex) => {
            const ringElement = document.createElement('div');
            ringElement.classList.add('soul-ring');
            
            if (ringIndex % 2 === 0) {
                ringElement.classList.add('spin-clockwise');
            } else {
                ringElement.classList.add('spin-counterclockwise');
            }

            for (let i = 0; i < ring.count; i++) {
                const soul = document.createElement('img');
                soul.src = soulAssetUrl; // Uses the dynamic foolproof absolute path
                soul.classList.add('soul-sprite');

                const angleDegree = (i / ring.count) * 360;
                const angleRad = (angleDegree * Math.PI) / 180;

                const x = Math.cos(angleRad) * ring.radius;
                const y = Math.sin(angleRad) * ring.radius;

                const targetFacingRotation = angleDegree + 270;

                soul.style.transform = `translate(${x}px, ${y}px) rotate(${targetFacingRotation}deg)`;
                ringElement.appendChild(soul);
            }

            container.appendChild(ringElement);
        });
    </script>

</body>
</html>
