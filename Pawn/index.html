<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrounded</title>
    <style>
        /* Immersive pure black full-screen layout matching your game theme */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The main stage holding everything in absolute coordinates */
        #scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Central Player Sprite Alignment */
        .player-sprite {
            position: absolute;
            z-index: 10;
            max-height: 120px; 
            image-rendering: pixelated; /* Keeps crispy retro pixel art clean */
        }

        /* Ring Container that manages individual layer sizing and alignment */
        .soul-ring {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Soul Sprite configuration and pointing geometry */
        .soul-sprite {
            position: absolute;
            width: 24px; /* Adjust size based on your pixel art specs */
            height: 24px;
            image-rendering: pixelated;
            transform-origin: center center; 
        }

        /* Alternating Continuous CSS Rotation Animations */
        .spin-clockwise {
            animation: spinCW 25s infinite linear;
        }

        .spin-counterclockwise {
            animation: spinCCW 25s infinite linear;
        }

        @keyframes spinCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinCCW {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="scene-container">
        <!-- FIXED PATH: Stepping back one directory level to reach the root Assets folder -->
        <img src="../Assets/Kris_Idle.png" alt="Kris" class="player-sprite">
    </div>

    <script>
        const container = document.getElementById('scene-container');
        
        // Configuration array for your concentric soul circles
        const ringSettings = [
            { radius: 130, count: 12 }, // Layer 1 (Closest)
            { radius: 220, count: 20 }, // Layer 2
            { radius: 310, count: 28 }, // Layer 3
            { radius: 400, count: 36 }  // Layer 4 (Furthest)
        ];

        // Loop through each ring tier setup
        ringSettings.forEach((ring, ringIndex) => {
            const ringElement = document.createElement('div');
            ringElement.classList.add('soul-ring');
            
            if (ringIndex % 2 === 0) {
                ringElement.classList.add('spin-clockwise');
            } else {
                ringElement.classList.add('spin-counterclockwise');
            }

            for (let i = 0; i < ring.count; i++) {
                const soul = document.createElement('img');
                // FIXED PATH: Stepping back one directory level here too
                soul.src = '../Assets/Soul.png'; 
                soul.classList.add('soul-sprite');

                const angleDegree = (i / ring.count) * 360;
                const angleRad = (angleDegree * Math.PI) / 180;

                const x = Math.cos(angleRad) * ring.radius;
                const y = Math.sin(angleRad) * ring.radius;

                // Rotates 270 degrees to keep the bottom facing inward
                const targetFacingRotation = angleDegree + 270;

                soul.style.transform = `translate(${x}px, ${y}px) rotate(${targetFacingRotation}deg)`;
                ringElement.appendChild(soul);
            }

            container.appendChild(ringElement);
        });
    </script>

</body>
</html>
