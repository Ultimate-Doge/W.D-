<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrounded</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sprite frame container protecting layout geometry */
        .player-wrapper {
            position: absolute;
            z-index: 10;
            width: auto;
            height: 120px;
            cursor: pointer;
        }

        /* Base Player Image */
        .player-sprite {
            height: 100%;
            image-rendering: pixelated; /* Keeps pixel art completely crisp */
            display: block;
        }

        /* 
           THE DUAL-LAYER RED ENGINE:
           Stacks a perfect duplicate clip over Kris using pure crimson background masks 
           so that yellow flashes are structurally impossible.
        */
        .red-flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff0000; /* Pure crimson */
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            opacity: 0; /* Hidden by default */
            pointer-events: none;
            filter: drop-shadow(0 0 15px #ff0000); 
        }

        /* STAGE 1 TIMING: Shakes the wrapper on the exact beats the red overlay flashes */
        .shake-slow-sync {
            animation: jitterSlowSync 0.3s infinite steps(1);
        }
        .flash-slow-sync {
            animation: overlaySlowSync 0.3s infinite steps(1);
        }

        /* STAGE 3 TIMING: Aggressive rapid side-to-side jitter synced with ultra-fast flashes */
        .shake-rapid-sync {
            animation: jitterRapidSync 0.06s infinite steps(1);
        }
        .flash-rapid-sync {
            animation: overlayRapidSync 0.06s infinite steps(1);
        }

        /* STAGE 1 BEAT SCHEDULING (Moves only when red opacity hits 1) */
        @keyframes jitterSlowSync {
            0%, 49% { transform: translateX(0); }
            50%, 100% { transform: translateX(-6px); }
        }
        @keyframes overlaySlowSync {
            0%, 49% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }

        /* STAGE 3 BEAT SCHEDULING (Rapid cross-vibration alternating colors) */
        @keyframes jitterRapidSync {
            0%, 49% { transform: translateX(8px); }
            50%, 100% { transform: translateX(-8px); }
        }
        @keyframes overlayRapidSync {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Soul Rings Configurations */
        .soul-ring {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .soul-sprite {
            position: absolute;
            width: 24px; 
            height: 24px;
            image-rendering: pixelated;
            transform-origin: center center; 
        }

        .spin-clockwise { animation: spinCW 25s infinite linear; }
        .spin-counterclockwise { animation: spinCCW 25s infinite linear; }

        @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <div id="scene-container">
        <div id="player-container" class="player-wrapper">
            <img id="player-img" alt="Kris" class="player-sprite">
            <div id="flash-overlay" class="red-flash-overlay"></div>
        </div>
    </div>

    <script>
        // FIXED PATH ENGINE: Targets the exact repository name safely
        const pathSegments = window.location.pathname.split('/').filter(s => s.length > 0);
        let repoBasePath = window.location.origin + '/';
        
        // Grab only the first folder segment (the repository folder name)
        if (pathSegments.length > 0) {
            repoBasePath += pathSegments[0] + '/';
        }

        const krisIdleUrl = repoBasePath + 'Assets/Kris_Idle.png';
        const krisDownUrl = repoBasePath + 'Assets/Kris_Down.png';
        const soulAssetUrl = repoBasePath + 'Assets/Soul.png';

        const playerElement = document.getElementById('player-img');
        const overlayElement = document.getElementById('flash-overlay');
        const containerElement = document.getElementById('player-container');

        // Apply assets cleanly
        playerElement.src = krisIdleUrl;
        overlayElement.style.webkitMaskImage = `url('${krisIdleUrl}')`;
        overlayElement.style.maskImage = `url('${krisIdleUrl}')`;

        // Populate Spinning Soul Matrix
        const container = document.getElementById('scene-container');
        const ringSettings = [
            { radius: 130, count: 12 }, 
            { radius: 220, count: 20 }, 
            { radius: 310, count: 28 }, 
            { radius: 400, count: 36 }  
        ];

        ringSettings.forEach((ring, ringIndex) => {
            const ringElement = document.createElement('div');
            ringElement.classList.add('soul-ring');
            ringElement.classList.add(ringIndex % 2 === 0 ? 'spin-clockwise' : 'spin-counterclockwise');

            for (let i = 0; i < ring.count; i++) {
                const soul = document.createElement('img');
                soul.src = soulAssetUrl; 
                soul.classList.add('soul-sprite');
                const angleDegree = (i / ring.count) * 360;
                const angleRad = (angleDegree * Math.PI) / 180;
                const x = Math.cos(angleRad) * ring.radius;
                const y = Math.sin(angleRad) * ring.radius;
                const targetFacingRotation = angleDegree + 270;

                soul.style.transform = `translate(${x}px, ${y}px) rotate(${targetFacingRotation}deg)`;
                ringElement.appendChild(soul);
            }
            container.appendChild(ringElement);
        });

        // --- SYNCHRONIZED CHOREOGRAPHY TIMELINE ---
        let isPlayingSequence = false;

        containerElement.addEventListener('click', () => {
            if (isPlayingSequence) return;
            isPlayingSequence = true;

            // Stage 1: Shaking happens exactly on the red stencil flash frames (1.0 Second)
            containerElement.classList.add('shake-slow-sync');
            overlayElement.classList.add('flash-slow-sync');

            setTimeout(() => {
                // Stage 2: Freeze shake completely, resting in a stable 70% opacity red filter tint (0.5 Seconds)
                containerElement.classList.remove('shake-slow-sync');
                overlayElement.classList.remove('flash-slow-sync');
                overlayElement.style.opacity = "0.7"; 

                setTimeout(() => {
                    // Stage 3: Extreme high-frequency vibration tied completely to fast mask flashes (0.5 Seconds)
                    overlayElement.style.opacity = ""; 
                    containerElement.classList.add('shake-rapid-sync');
                    overlayElement.classList.add('flash-rapid-sync');

                    setTimeout(() => {
                        // Finale: Drop all active animation tags and snap instantly into Kris_Down
                        containerElement.classList.remove('shake-rapid-sync');
                        overlayElement.classList.remove('flash-rapid-sync');
                        
                        playerElement.src = krisDownUrl;
                        overlayElement.style.display = "none"; // Hide mask layer entirely

                    }, 500); // Stage 3 Duration

                }, 500); // Stage 2 Duration

            }, 1000); // Stage 1 Duration
        });
    </script>

</body>
</html>
