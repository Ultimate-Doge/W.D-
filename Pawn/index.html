<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrounded</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Central Player Base Styling */
        .player-sprite {
            position: absolute;
            z-index: 10;
            max-height: 120px; 
            image-rendering: pixelated; /* Keeps pixel art completely crisp */
            cursor: pointer;
            transition: filter 0.05s ease;
        }

        /* STAGE 1: Low-framerate pixel tremors + rhythmic, heartbeat crimson silhouette flashes */
        .dr-tremor-slow {
            animation: 
                retroJitterSlow 0.06s infinite steps(2), 
                deltaruneCenterRedFlash 0.30s infinite steps(1);
        }

        /* STAGE 2: Eerie resting frame. Shaking completely drops, but the red energy hum remains locked over Kris */
        .dr-pause-glow {
            animation: staticCenterRedGlow 0.1s infinite steps(1);
        }

        /* STAGE 3: Violent structural vibration + erratic, blinding crimson warning flashes */
        .dr-tremor-rapid {
            animation: 
                retroJitterRapid 0.03s infinite steps(1), 
                frenzyCenterRedFlash 0.08s infinite steps(1);
        }

        /* RETRO JITTER (Sharp coordinate snapping strictly on the horizontal X-axis) */
        @keyframes retroJitterSlow {
            0% { transform: translate(-3px, 0); }
            50% { transform: translate(3px, 0); }
            100% { transform: translate(-2px, 0); }
        }

        @keyframes retroJitterRapid {
            0% { transform: translate(-6px, 0); }
            25% { transform: translate(5px, 0); }
            50% { transform: translate(-4px, 0); }
            75% { transform: translate(6px, 0); }
            100% { transform: translate(-5px, 0); }
        }

        /* 
          DELTARUNE OVERLAY MATH:
          By using 'sepia(1) saturate(15) hue-rotate(-50deg)', we force the entire 
          image center—including clothes, face, and skin—to instantly re-color into a sharp, 
          glowing crimson silhouette, bypassing the standard drop-shadow padding completely.
        */
        @keyframes deltaruneCenterRedFlash {
            0%, 50% { filter: none; }
            51%, 80% { filter: drop-shadow(0 0 15px #ff0000) sepia(1) saturate(20) hue-rotate(-50deg) brightness(0.9); }
            81%, 100% { filter: none; }
        }

        @keyframes staticCenterRedGlow {
            0%, 100% { filter: drop-shadow(0 0 20px #ff0000) sepia(1) saturate(15) hue-rotate(-50deg) brightness(0.7); }
        }

        @keyframes frenzyCenterRedFlash {
            0%, 100% { filter: drop-shadow(0 0 35px #ff0000) sepia(1) saturate(25) hue-rotate(-50deg) brightness(1.2); }
            50% { filter: none; }
        }

        /* Soul Rings Configurations */
        .soul-ring {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .soul-sprite {
            position: absolute;
            width: 24px; 
            height: 24px;
            image-rendering: pixelated;
            transform-origin: center center; 
        }

        .spin-clockwise { animation: spinCW 25s infinite linear; }
        .spin-counterclockwise { animation: spinCCW 25s infinite linear; }

        @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <div id="scene-container">
        <img id="player-img" alt="Kris" class="player-sprite">
    </div>

    <script>
        // Folder depth path engine
        const pathSegments = window.location.pathname.split('/').filter(s => s.length > 0);
        let repoBasePath = window.location.origin + '/';
        if (pathSegments.length > 1) {
            repoBasePath += pathSegments + '/';
        }

        const krisIdleUrl = repoBasePath + 'Assets/Kris_Idle.png';
        const krisDownUrl = repoBasePath + 'Assets/Kris_Down.png';
        const soulAssetUrl = repoBasePath + 'Assets/Soul.png';

        const playerElement = document.getElementById('player-img');
        playerElement.src = krisIdleUrl;

        // Populate Spinning Soul Matrix
        const container = document.getElementById('scene-container');
        const ringSettings = [
            { radius: 130, count: 12 }, 
            { radius: 220, count: 20 }, 
            { radius: 310, count: 28 }, 
            { radius: 400, count: 36 }  
        ];

        ringSettings.forEach((ring, ringIndex) => {
            const ringElement = document.createElement('div');
            ringElement.classList.add('soul-ring');
            ringElement.classList.add(ringIndex % 2 === 0 ? 'spin-clockwise' : 'spin-counterclockwise');

            for (let i = 0; i < ring.count; i++) {
                const soul = document.createElement('img');
                soul.src = soulAssetUrl; 
                soul.classList.add('soul-sprite');
                const angleDegree = (i / ring.count) * 360;
                const angleRad = (angleDegree * Math.PI) / 180;
                const x = Math.cos(angleRad) * ring.radius;
                const y = Math.sin(angleRad) * ring.radius;
                const targetFacingRotation = angleDegree + 270;

                soul.style.transform = `translate(${x}px, ${y}px) rotate(${targetFacingRotation}deg)`;
                ringElement.appendChild(soul);
            }
            container.appendChild(ringElement);
        });

        // --- AUTHENTIC TIMELINE CHOREOGRAPHY ENGINE ---
        let isPlayingSequence = false;

        playerElement.addEventListener('click', () => {
            if (isPlayingSequence) return;
            isPlayingSequence = true;

            // Stage 1: Sharp pixel tremors + center-covering red flashes (1.0 Second)
            playerElement.classList.add('dr-tremor-slow');

            setTimeout(() => {
                // Stage 2: Shaking pauses, keeping the deep red energy over the center of the image (0.5 Seconds)
                playerElement.classList.remove('dr-tremor-slow');
                playerElement.classList.add('dr-pause-glow');
                
                setTimeout(() => {
                    // Stage 3: High-frequency jitter + erratic crimson flashes across the whole sprite texture (0.5 Seconds)
                    playerElement.classList.remove('dr-pause-glow');
                    playerElement.classList.add('dr-tremor-rapid');

                    setTimeout(() => {
                        // Finale: Clear out flash styles and drop to Down state pose instantly
                        playerElement.classList.remove('dr-tremor-rapid');
                        playerElement.src = krisDownUrl; 

                    }, 500); // Stage 3 Duration

                }, 500); // Stage 2 Duration

            }, 1000); // Stage 1 Duration
        });
    </script>

</body>
</html>
