<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kris Soul Orbit</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    #scene {
        position: fixed;
        inset: 0;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    #center {
        position: relative;

        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
    }

    /* Kris */
    #kris {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 180px;
        height: 180px;

        transform: translate(-50%, -50%);

        object-fit: contain;

        image-rendering: pixelated;

        z-index: 1000;
    }

    /* Rotating rings */
    .layer {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 0;
        height: 0;

        transform-origin: center;
    }

    /* Soul images */
    .soul {
        position: absolute;

        left: 0;
        top: 0;

        width: 45px;
        height: 45px;

        object-fit: contain;

        image-rendering: pixelated;

        transform-origin: center;
    }

    /* Clockwise */
    .clockwise {
        animation:
            spinClockwise var(--speed) linear infinite;
    }

    /* Counter-clockwise */
    .counterclockwise {
        animation:
            spinCounterClockwise var(--speed) linear infinite;
    }

    @keyframes spinClockwise {

        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }

    }

    @keyframes spinCounterClockwise {

        from {
            transform: rotate(360deg);
        }

        to {
            transform: rotate(0deg);
        }

    }

</style>
</head>

<body>

<div id="scene">

    <div id="center">

        <!-- Kris in the middle -->
        <img
            id="kris"
            src="../Assets/Kris_Idle.png"
        >

    </div>

</div>


<script>

//
// SETTINGS
//

// Number of rings around Kris
const NUMBER_OF_LAYERS = 5;

// Souls on each ring
const SOULS_PER_LAYER = 8;

// Distance of the first ring from Kris
const START_RADIUS = 150;

// Distance between rings
const LAYER_DISTANCE = 85;

// Size of Soul.png
const SOUL_SIZE = 45;

// Speed of the first ring
const BASE_SPEED = 12;


// Kris container
const center = document.getElementById("center");


// Create every layer
for (let layerNumber = 0; layerNumber < NUMBER_OF_LAYERS; layerNumber++) {

    const layer = document.createElement("div");

    layer.classList.add("layer");


    //
    // Alternate directions
    //
    if (layerNumber % 2 === 0) {

        // Layer 1, 3, 5...
        layer.classList.add("clockwise");

    } else {

        // Layer 2, 4...
        layer.classList.add("counterclockwise");

    }


    //
    // Speed
    //
    const speed =
        BASE_SPEED +
        (layerNumber * 3);

    layer.style.setProperty(
        "--speed",
        speed + "s"
    );


    //
    // Radius
    //
    const radius =
        START_RADIUS +
        (layerNumber * LAYER_DISTANCE);


    //
    // Create Souls
    //
    for (
        let soulNumber = 0;
        soulNumber < SOULS_PER_LAYER;
        soulNumber++
    ) {

        const soul = document.createElement("img");

        soul.classList.add("soul");

        soul.src = "../Assets/Soul.png";


        //
        // Spread Souls evenly around the circle
        //
        const angle =
            (soulNumber / SOULS_PER_LAYER) * 360;


        //
        // Convert degrees to radians
        //
        const radians =
            angle * Math.PI / 180;


        //
        // Calculate position
        //
        const x =
            Math.cos(radians) * radius;


        const y =
            Math.sin(radians) * radius;


        //
        // Make Soul point toward Kris
        //
        const facingAngle =
            angle + 90;


        soul.style.width = SOUL_SIZE + "px";
        soul.style.height = SOUL_SIZE + "px";


        soul.style.transform =
            `translate(-50%, -50%)
             translate(${x}px, ${y}px)
             rotate(${facingAngle}deg)`;


        layer.appendChild(soul);

    }


    //
    // Add layer to Kris' container
    //
    center.appendChild(layer);

}

</script>

</body>
</html>
