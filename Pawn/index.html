<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrounded</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Central Player Base Styling */
        .player-sprite {
            position: absolute;
            z-index: 10;
            max-height: 120px; 
            image-rendering: pixelated; /* Keeps pixel art completely crisp */
            cursor: pointer;
        }

        /* STAGE 1: Steady, rhythmic red flashes that shake Kris on every single beat */
        .dr-tremor-slow {
            animation: deltaruneSynchronizedSlow 0.3s infinite steps(1);
        }

        /* STAGE 2: The eerie pause. Shaking stops completely, but a resting red aura holds over them */
        .dr-pause-glow {
            filter: drop-shadow(0 0 15px #ff0000) sepia(1) saturate(5) brightness(0.6);
        }

        /* STAGE 3: Violent, ultra-rapid frantic vibration synced to blinding crimson flashes */
        .dr-tremor-rapid {
            animation: deltaruneSynchronizedRapid 0.06s infinite steps(1);
        }

        /* 
          PURE RED SYNCHRONIZATION MATH:
          By using 'sepia(1) saturate(10) hue-rotate(0deg)' instead of negative values, 
          the sprite turns completely crimson red with NO yellow tints.
          The translate X axis only shifts when the red filter kicks in!
        */
        @keyframes deltaruneSynchronizedSlow {
            /* Frame A: Normal texture, centered */
            0%, 49% { 
                transform: translateX(0); 
                filter: none; 
            }
            /* Frame B: Crimson Red overlay, shakes 5px to the left */
            50%, 100% { 
                transform: translateX(-5px); 
                filter: drop-shadow(0 0 15px #ff0000) sepia(1) saturate(20) brightness(0.8); 
            }
        }

        @keyframes deltaruneSynchronizedRapid {
            /* Frame A: Crimson Red overlay, shakes 8px to the right */
            0%, 49% { 
                transform: translateX(8px); 
                filter: drop-shadow(0 0 25px #ff0000) sepia(1) saturate(25) brightness(1.2); 
            }
            /* Frame B: Normal texture, shakes 8px to the left */
            50%, 100% { 
                transform: translateX(-8px); 
                filter: none; 
            }
        }

        /* Soul Rings Configurations */
        .soul-ring {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .soul-sprite {
            position: absolute;
            width: 24px; 
            height: 24px;
            image-rendering: pixelated;
            transform-origin: center center; 
        }

        .spin-clockwise { animation: spinCW 25s infinite linear; }
        .spin-counterclockwise { animation: spinCCW 25s infinite linear; }

        @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <div id="scene-container">
        <img id="player-img" alt="Kris" class="player-sprite">
    </div>

    <script>
        // Folder depth path engine for GitHub pages
        const pathSegments = window.location.pathname.split('/').filter(s => s.length > 0);
        let repoBasePath = window.location.origin + '/';
        if (pathSegments.length > 1) {
            repoBasePath += pathSegments + '/';
        }

        const krisIdleUrl = repoBasePath + 'Assets/Kris_Idle.png';
        const krisDownUrl = repoBasePath + 'Assets/Kris_Down.png';
        const soulAssetUrl = repoBasePath + 'Assets/Soul.png';

        const playerElement = document.getElementById('player-img');
        playerElement.src = krisIdleUrl;

        // Populate Spinning Soul Matrix
        const container = document.getElementById('scene-container');
        const ringSettings = [
            { radius: 130, count: 12 }, 
            { radius: 220, count: 20 }, 
            { radius: 310, count: 28 }, 
            { radius: 400, count: 36 }  
        ];

        ringSettings.forEach((ring, ringIndex) => {
            const ringElement = document.createElement('div');
            ringElement.classList.add('soul-ring');
            ringElement.classList.add(ringIndex % 2 === 0 ? 'spin-clockwise' : 'spin-counterclockwise');

            for (let i = 0; i < ring.count; i++) {
                const soul = document.createElement('img');
                soul.src = soulAssetUrl; 
                soul.classList.add('soul-sprite');
                const angleDegree = (i / ring.count) * 360;
                const angleRad = (angleDegree * Math.PI) / 180;
                const x = Math.cos(angleRad) * ring.radius;
                const y = Math.sin(angleRad) * ring.radius;
                const targetFacingRotation = angleDegree + 270;

                soul.style.transform = `translate(${x}px, ${y}px) rotate(${targetFacingRotation}deg)`;
                ringElement.appendChild(soul);
            }
            container.appendChild(ringElement);
        });

        // --- THE 3-STAGE CHOREOGRAPHY TIMELINE ---
        let isPlayingSequence = false;

        playerElement.addEventListener('click', () => {
            if (isPlayingSequence) return;
            isPlayingSequence = true;

            // Stage 1: Synced red flashes and low-framerate ticks (1.0 Second)
            playerElement.classList.add('dr-tremor-slow');

            setTimeout(() => {
                // Stage 2: Shaking stops, holding a clean crimson shade over the center (0.5 Seconds)
                playerElement.classList.remove('dr-tremor-slow');
                playerElement.classList.add('dr-pause-glow');
                
                setTimeout(() => {
                    // Stage 3: Extreme vibration linked entirely to ultra-rapid flashes (0.5 Seconds)
                    playerElement.classList.remove('dr-pause-glow');
                    playerElement.classList.add('dr-tremor-rapid');

                    setTimeout(() => {
                        // Finale: Remove filter animations and drop to the Kris_Down image instantly
                        playerElement.classList.remove('dr-tremor-rapid');
                        playerElement.src = krisDownUrl; 

                    }, 500); // Stage 3 Duration

                }, 500); // Stage 2 Duration

            }, 1000); // Stage 1 Duration
        });
    </script>

</body>
</html>
