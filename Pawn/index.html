<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The pawn on the chess board...</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    font-family: Arial, sans-serif;
}


/* =========================================
   TITLE
========================================= */

#title {
    position: fixed;

    top: 30px;
    left: 0;

    width: 100%;

    text-align: center;

    color: white;

    font-size: clamp(22px, 4vw, 42px);

    font-weight: bold;

    z-index: 5000;

    pointer-events: none;

    text-shadow:
        2px 2px 0 black,
        -2px -2px 0 black,
        2px -2px 0 black,
        -2px 2px 0 black;
}


/* =========================================
   SCENE
========================================= */

#scene {
    position: fixed;
    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    background: black;
}


#center {
    position: relative;

    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
}


/* =========================================
   KRIS
========================================= */

#kris {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;
    height: 180px;

    transform: translate(-50%, -50%);

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 1000;

    cursor: pointer;
}


/* =========================================
   KRIS RED FLASH
========================================= */

/*
    The red effect is attached directly
    to Kris instead of covering the screen.
*/

#kris.shaking {
    animation:
        krisShake 0.07s infinite,
        krisRedFlash 0.12s infinite;
}


@keyframes krisShake {

    0% {
        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0deg);
    }

    20% {
        transform:
            translate(-50%, -50%)
            translate(-6px, 2px)
            rotate(-2deg);
    }

    40% {
        transform:
            translate(-50%, -50%)
            translate(6px, -2px)
            rotate(2deg);
    }

    60% {
        transform:
            translate(-50%, -50%)
            translate(-5px, -2px)
            rotate(-2deg);
    }

    80% {
        transform:
            translate(-50%, -50%)
            translate(5px, 2px)
            rotate(2deg);
    }

    100% {
        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0deg);
    }

}


/*
    Red flashes only on Kris.
*/

@keyframes krisRedFlash {

    0% {
        filter:
            brightness(1)
            sepia(0);
    }

    50% {
        filter:
            brightness(1.5)
            sepia(1)
            saturate(6)
            hue-rotate(-20deg);
    }

    100% {
        filter:
            brightness(1)
            sepia(0);
    }

}


/* =========================================
   SOUL RINGS
========================================= */

.layer {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    transform-origin: center;

    pointer-events: none;
}


.soul {
    position: absolute;

    left: 0;
    top: 0;

    width: 45px;
    height: 45px;

    object-fit: contain;

    image-rendering: pixelated;
}


.clockwise {
    animation:
        spinClockwise var(--speed) linear infinite;
}


.counterclockwise {
    animation:
        spinCounterClockwise var(--speed) linear infinite;
}


@keyframes spinClockwise {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


@keyframes spinCounterClockwise {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}


/* =========================================
   FLYING SOUL
========================================= */

#flyingSoul {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 55px;
    height: 55px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 3000;

    pointer-events: none;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(1);
}


/*
    Much faster flight.

    It only becomes slightly larger
    and smoothly fades away.
*/

#flyingSoul.fly {

    animation:
        soulFly 0.65s
        cubic-bezier(0.2, 0.8, 0.2, 1)
        forwards;
}


@keyframes soulFly {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    40% {

        opacity: 0.85;

        transform:
            translate(-50%, -50%)
            scale(1.12);
    }

    75% {

        opacity: 0.45;

        transform:
            translate(-50%, -50%)
            scale(1.22);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1.3);
    }

}


/* =========================================
   TEXT BOX
========================================= */

#textBox {

    position: fixed;

    left: 50%;
    bottom: 35px;

    transform: translateX(-50%);

    width: min(90vw, 700px);

    z-index: 7000;

    display: none;
}


#textBoxImage {

    display: block;

    width: 100%;
    height: auto;

    image-rendering: pixelated;
}


#textBoxText {

    position: absolute;

    left: 8%;
    right: 8%;

    top: 50%;

    transform: translateY(-50%);

    color: white;

    font-size: clamp(18px, 3vw, 30px);

    font-family: monospace;

    text-align: center;

    text-shadow:
        2px 2px 0 black,
        -1px -1px 0 black;

    pointer-events: none;
}


/* =========================================
   FINAL FLASH
========================================= */

#absorbFlash {

    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 6000;
}


#absorbFlash.active {

    animation:
        absorbAnimation 0.4s ease-out forwards;
}


@keyframes absorbAnimation {

    0% {
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================
   BLACKOUT
========================================= */

#blackout {

    position: fixed;

    inset: 0;

    background: black;

    opacity: 0;

    pointer-events: none;

    z-index: 5500;

    transition: opacity 0.5s;
}


#blackout.active {
    opacity: 1;
}

</style>
</head>


<body>


<!-- =====================================
     TITLE
===================================== -->

<div id="title">
    The pawn on the chess board...
</div>


<!-- =====================================
     MAIN SCENE
===================================== -->

<div id="scene">

    <div id="center">

        <img
            id="kris"
            src="../Assets/Kris_Idle.png"
            alt="Kris"
        >

    </div>

</div>


<!-- =====================================
     FLYING SOUL
===================================== -->

<img
    id="flyingSoul"
    src="../Assets/Soul.png"
    alt=""
>


<!-- =====================================
     EFFECTS
===================================== -->

<div id="absorbFlash"></div>

<div id="blackout"></div>


<!-- =====================================
     TEXT BOX
===================================== -->

<div id="textBox">

    <img
        id="textBoxImage"
        src="../Assets/Text_Box.png"
        alt=""
    >

    <div id="textBoxText">
        (No One Is here)
    </div>

</div>


<script>


/* =========================================
   SETTINGS
========================================= */

const NUMBER_OF_LAYERS = 5;

const SOULS_PER_LAYER = 8;

const START_RADIUS = 150;

const LAYER_DISTANCE = 85;

const SOUL_SIZE = 45;

const BASE_SPEED = 12;


/* =========================================
   ELEMENTS
========================================= */

const center =
    document.getElementById("center");

const kris =
    document.getElementById("kris");

const flyingSoul =
    document.getElementById("flyingSoul");

const absorbFlash =
    document.getElementById("absorbFlash");

const blackout =
    document.getElementById("blackout");

const textBox =
    document.getElementById("textBox");


/* =========================================
   CHECK SAVE DATA
========================================= */

/*
    This survives closing and reopening
    the website in the same browser.
*/

const soulTaken =
    localStorage.getItem("krisSoulTaken");


/*
    If the sequence was already completed,
    don't show Kris or the Soul rings.

    Just show the textbox.
*/

if (soulTaken === "true") {

    textBox.style.display = "block";

    kris.style.display = "none";

}


/* =========================================
   CREATE SOUL RINGS
========================================= */

if (soulTaken !== "true") {

    for (
        let layerNumber = 0;
        layerNumber < NUMBER_OF_LAYERS;
        layerNumber++
    ) {

        const layer =
            document.createElement("div");


        layer.classList.add("layer");


        /*
            Alternate directions
        */

        if (layerNumber % 2 === 0) {

            layer.classList.add(
                "clockwise"
            );

        } else {

            layer.classList.add(
                "counterclockwise"
            );

        }


        /*
            Different speed for each ring
        */

        const speed =
            BASE_SPEED +
            (layerNumber * 3);


        layer.style.setProperty(
            "--speed",
            speed + "s"
        );


        /*
            Ring distance
        */

        const radius =
            START_RADIUS +
            (layerNumber * LAYER_DISTANCE);


        /*
            Create Souls
        */

        for (
            let soulNumber = 0;
            soulNumber < SOULS_PER_LAYER;
            soulNumber++
        ) {

            const soul =
                document.createElement("img");


            soul.classList.add("soul");


            soul.src =
                "../Assets/Soul.png";


            soul.style.width =
                SOUL_SIZE + "px";


            soul.style.height =
                SOUL_SIZE + "px";


            /*
                Position around ring
            */

            const angle =
                (soulNumber /
                SOULS_PER_LAYER) * 360;


            const radians =
                angle * Math.PI / 180;


            const x =
                Math.cos(radians) *
                radius;


            const y =
                Math.sin(radians) *
                radius;


            /*
                Point toward Kris
            */

            soul.style.transform =
                `translate(-50%, -50%)
                 translate(${x}px, ${y}px)
                 rotate(${angle + 90}deg)`;


            layer.appendChild(soul);

        }


        center.appendChild(layer);

    }

}


/* =========================================
   KRIS ACTIVATION
========================================= */

let activated = false;


function activate() {

    if (activated)
        return;

    activated = true;


    /*
        Pause the Soul rings.
    */

    document
        .querySelectorAll(".layer")
        .forEach(layer => {

            layer.style.animationPlayState =
                "paused";

        });


    /*
        =====================================
        PHASE 1
        KRIS SHAKES + FLASHES RED
        =====================================
    */

    kris.classList.add("shaking");


    /*
        =====================================
        PHASE 2
        KRIS GOES DOWN + SOUL APPEARS
        =====================================
    */

    setTimeout(() => {

        kris.classList.remove(
            "shaking"
        );


        /*
            Change Kris's image
        */

        kris.src =
            "../Assets/Kris_Down.png";


        /*
            Soul appears immediately
            as Kris goes down.
        */

        flyingSoul.style.opacity = "1";

        flyingSoul.classList.add("fly");


    }, 800);


    /*
        =====================================
        PHASE 3
        SOUL REACHES SCREEN
        =====================================
    */

    setTimeout(() => {

        absorbFlash.classList.add(
            "active"
        );

    }, 1250);


    /*
        =====================================
        PHASE 4
        SAVE + TEXT BOX
        =====================================
    */

    setTimeout(() => {

        /*
            Save that the Soul has been
            taken.

            This remains even after the
            page is closed.
        */

        localStorage.setItem(
            "krisSoulTaken",
            "true"
        );


        /*
            Hide everything.
        */

        blackout.classList.add(
            "active"
        );


    }, 1700);


    /*
        =====================================
        PHASE 5
        SHOW "(No One Is here)"
        =====================================
    */

    setTimeout(() => {

        kris.style.display = "none";

        flyingSoul.style.display = "none";


        document
            .querySelectorAll(".layer")
            .forEach(layer => {

                layer.style.display = "none";

            });


        blackout.classList.remove(
            "active"
        );


        textBox.style.display =
            "block";


    }, 2300);

}


/* =========================================
   DESKTOP CLICK
========================================= */

kris.addEventListener(
    "click",
    activate
);


/* =========================================
   MOBILE TOUCH
========================================= */

kris.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        activate();

    }
);

</script>

</body>
</html>
