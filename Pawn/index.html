<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The pawn on the chess board...</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        font-family: Arial, sans-serif;
    }

    /* =========================
       TITLE
    ========================= */

    #title {
        position: fixed;

        top: 30px;
        left: 0;
        width: 100%;

        text-align: center;

        color: white;

        font-size: clamp(22px, 4vw, 42px);
        font-weight: bold;

        z-index: 5000;

        pointer-events: none;

        text-shadow:
            2px 2px 0 #000,
            -2px -2px 0 #000,
            2px -2px 0 #000,
            -2px 2px 0 #000;
    }


    /* =========================
       MAIN SCENE
    ========================= */

    #scene {
        position: fixed;
        inset: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #000;
    }


    #center {
        position: relative;

        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
    }


    /* =========================
       KRIS
    ========================= */

    #kris {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 180px;
        height: 180px;

        transform: translate(-50%, -50%);

        object-fit: contain;

        image-rendering: pixelated;

        z-index: 1000;

        cursor: pointer;

        transition: filter 0.05s;
    }


    /* =========================
       SOUL RINGS
    ========================= */

    .layer {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 0;
        height: 0;

        transform-origin: center;

        pointer-events: none;
    }


    .soul {
        position: absolute;

        left: 0;
        top: 0;

        width: 45px;
        height: 45px;

        object-fit: contain;

        image-rendering: pixelated;
    }


    .clockwise {
        animation:
            spinClockwise var(--speed) linear infinite;
    }


    .counterclockwise {
        animation:
            spinCounterClockwise var(--speed) linear infinite;
    }


    @keyframes spinClockwise {

        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }

    }


    @keyframes spinCounterClockwise {

        from {
            transform: rotate(360deg);
        }

        to {
            transform: rotate(0deg);
        }

    }


    /* =========================
       KRIS SHAKE
    ========================= */

    #kris.shaking {
        animation: krisShake 0.08s infinite;
    }


    @keyframes krisShake {

        0% {
            transform:
                translate(-50%, -50%)
                translate(0px, 0px)
                rotate(0deg);
        }

        20% {
            transform:
                translate(-50%, -50%)
                translate(-5px, 2px)
                rotate(-2deg);
        }

        40% {
            transform:
                translate(-50%, -50%)
                translate(5px, -2px)
                rotate(2deg);
        }

        60% {
            transform:
                translate(-50%, -50%)
                translate(-4px, -2px)
                rotate(-1deg);
        }

        80% {
            transform:
                translate(-50%, -50%)
                translate(4px, 2px)
                rotate(1deg);
        }

        100% {
            transform:
                translate(-50%, -50%)
                translate(0px, 0px)
                rotate(0deg);
        }

    }


    /* =========================
       RED FLASH
    ========================= */

    #redFlash {
        position: fixed;
        inset: 0;

        background: red;

        opacity: 0;

        pointer-events: none;

        z-index: 4000;
    }


    #redFlash.active {
        animation: redFlashAnimation 0.12s infinite;
    }


    @keyframes redFlashAnimation {

        0% {
            opacity: 0;
        }

        50% {
            opacity: 0.45;
        }

        100% {
            opacity: 0;
        }

    }


    /* =========================
       FLYING SOUL
    ========================= */

    #flyingSoul {
        position: fixed;

        left: 50%;
        top: 50%;

        width: 55px;
        height: 55px;

        object-fit: contain;

        image-rendering: pixelated;

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 0;

        z-index: 3000;

        pointer-events: none;
    }


    #flyingSoul.fly {
        animation: soulFly 1.5s cubic-bezier(0.15, 0.7, 0.1, 1) forwards;
    }


    @keyframes soulFly {

        0% {
            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }

        35% {
            transform:
                translate(-50%, -50%)
                scale(1.5);
        }

        70% {
            transform:
                translate(-50%, -50%)
                scale(4);
        }

        100% {
            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(30);

            opacity: 1;
        }

    }


    /* =========================
       ABSORB FLASH
    ========================= */

    #absorbFlash {
        position: fixed;
        inset: 0;

        background: white;

        opacity: 0;

        pointer-events: none;

        z-index: 6000;
    }


    #absorbFlash.active {
        animation: absorbAnimation 0.45s ease-out forwards;
    }


    @keyframes absorbAnimation {

        0% {
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        100% {
            opacity: 0;
        }

    }


    /* =========================
       FADE AFTER EFFECT
    ========================= */

    #blackout {
        position: fixed;
        inset: 0;

        background: black;

        opacity: 0;

        pointer-events: none;

        z-index: 5500;

        transition: opacity 0.5s;
    }


    #blackout.active {
        opacity: 1;
    }

</style>
</head>


<body>

<!-- TITLE -->

<div id="title">
    The pawn on the chess board...
</div>


<!-- SCENE -->

<div id="scene">

    <div id="center">

        <!-- Kris -->
        <img
            id="kris"
            src="../Assets/Kris_Idle.png"
            alt="Kris"
        >

    </div>

</div>


<!-- Effects -->

<div id="redFlash"></div>

<img
    id="flyingSoul"
    src="../Assets/Soul.png"
    alt=""
>

<div id="blackout"></div>

<div id="absorbFlash"></div>


<script>

/* =========================================
   SETTINGS
========================================= */

const NUMBER_OF_LAYERS = 5;

const SOULS_PER_LAYER = 8;

const START_RADIUS = 150;

const LAYER_DISTANCE = 85;

const SOUL_SIZE = 45;

const BASE_SPEED = 12;


/* =========================================
   ELEMENTS
========================================= */

const center =
    document.getElementById("center");

const kris =
    document.getElementById("kris");

const redFlash =
    document.getElementById("redFlash");

const flyingSoul =
    document.getElementById("flyingSoul");

const absorbFlash =
    document.getElementById("absorbFlash");

const blackout =
    document.getElementById("blackout");


/* =========================================
   CREATE SOUL RINGS
========================================= */

for (
    let layerNumber = 0;
    layerNumber < NUMBER_OF_LAYERS;
    layerNumber++
) {

    const layer =
        document.createElement("div");


    layer.classList.add("layer");


    /* Alternate directions */

    if (layerNumber % 2 === 0) {

        layer.classList.add("clockwise");

    } else {

        layer.classList.add("counterclockwise");

    }


    /* Different speed per layer */

    const speed =
        BASE_SPEED +
        (layerNumber * 3);


    layer.style.setProperty(
        "--speed",
        speed + "s"
    );


    /* Radius */

    const radius =
        START_RADIUS +
        (layerNumber * LAYER_DISTANCE);


    /* Create Souls */

    for (
        let soulNumber = 0;
        soulNumber < SOULS_PER_LAYER;
        soulNumber++
    ) {

        const soul =
            document.createElement("img");


        soul.classList.add("soul");


        soul.src =
            "../Assets/Soul.png";


        soul.style.width =
            SOUL_SIZE + "px";


        soul.style.height =
            SOUL_SIZE + "px";


        /* Position around circle */

        const angle =
            (soulNumber / SOULS_PER_LAYER) * 360;


        const radians =
            angle * Math.PI / 180;


        const x =
            Math.cos(radians) * radius;


        const y =
            Math.sin(radians) * radius;


        /*
            Make the Soul point toward
            the centre.
        */

        soul.style.transform =
            `translate(-50%, -50%)
             translate(${x}px, ${y}px)
             rotate(${angle + 90}deg)`;


        layer.appendChild(soul);

    }


    center.appendChild(layer);

}


/* =========================================
   CLICK KRIS
========================================= */

let activated = false;


kris.addEventListener("click", activate);


kris.addEventListener("touchstart", function(event) {

    event.preventDefault();

    activate();

});


function activate() {

    /*
        Prevent the sequence from being
        triggered multiple times.
    */

    if (activated)
        return;

    activated = true;


    /* =====================================
       PHASE 1 — SHAKE + RED FLASH
    ===================================== */

    kris.classList.add("shaking");

    redFlash.classList.add("active");


    /*
        Disable the surrounding rings
        during the sequence.
    */

    document
        .querySelectorAll(".layer")
        .forEach(layer => {

            layer.style.animationPlayState =
                "paused";

        });


    /* =====================================
       PHASE 2 — KRIS CHANGES
    ===================================== */

    setTimeout(() => {

        kris.classList.remove("shaking");

        redFlash.classList.remove("active");


        /*
            Change Kris to the downward
            pose.
        */

        kris.src =
            "../Assets/Kris_Down.png";


    }, 1000);


    /* =====================================
       PHASE 3 — SPAWN SOUL
    ===================================== */

    setTimeout(() => {

        flyingSoul.classList.add("fly");

    }, 1300);


    /* =====================================
       PHASE 4 — SOUL REACHES SCREEN
    ===================================== */

    setTimeout(() => {

        /*
            White flash across the entire
            screen.
        */

        absorbFlash.classList.add("active");

    }, 2750);


    /* =====================================
       PHASE 5 — FINISH
    ===================================== */

    setTimeout(() => {

        blackout.classList.add("active");

    }, 3300);

}

</script>

</body>
</html>
