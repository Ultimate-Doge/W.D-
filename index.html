<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKER YET DARKER</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            animation: cleanVibe 0.08s infinite linear;
            gap: 40px;
        }

        @keyframes cleanVibe {
            0% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, 1px); }
            100% { transform: translate(1px, 1px); }
        }

        .shake-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
            font-family: 'Wingdings', 'Webdings', sans-serif;
            font-size: 3.5rem;
            color: #ffffff;
            user-select: none;
        }

        .char {
            display: inline-block;
            white-space: pre;
            animation: letterVibe 0.06s infinite ease-in-out;
        }

        @keyframes letterVibe {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            50% { transform: translate(1px, -1px) rotate(0.5deg); }
            75% { transform: translate(-1px, -1px) rotate(0deg); }
            100% { transform: translate(1px, 1px) rotate(-0.5deg); }
        }

        .char:nth-child(2n) { animation-delay: 0.01s; animation-duration: 0.05s; }
        .char:nth-child(3n) { animation-delay: 0.02s; animation-duration: 0.07s; }
        .char:nth-child(4n) { animation-delay: 0.03s; animation-duration: 0.06s; }

        .stealth-input {
            width: 300px;
            padding: 12px 20px;
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
            font-size: 1rem;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stealth-input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        .stealth-input:hover, 
        .stealth-input:focus {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <input type="text" id="secretInput" class="stealth-input" placeholder="...">

    <script>
        const inputField = document.getElementById('secretInput');

        inputField.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const cleanValue = inputField.value.trim().toLowerCase();
                
                if (cleanValue === 'fountain') {
                    // Redirects to your Egg room page
                    window.location.href = 'Egg.html'; 
                } else if (cleanValue === 'reset') {
                    // Clears all items and memory entirely
                    localStorage.clear();
                    alert("Game Memory Cleared.");
                    inputField.value = '';
                } else {
                    inputField.value = '';
                }
            }
        });
    </script>
