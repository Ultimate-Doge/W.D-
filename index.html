<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKER YET DARKER</title>
    <style>
        /* A subtle, uniform rattle for the background */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            animation: cleanVibe 0.08s infinite linear;
        }

        @keyframes cleanVibe {
            0% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, 1px); }
            100% { transform: translate(1px, 1px); }
        }

        /* Container for the centered pure white text */
        .shake-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
            font-family: 'Wingdings', 'Webdings', sans-serif;
            font-size: 3.5rem;
            color: #ffffff; /* Pure white */
            user-select: none;
        }

        /* Light, rapid vibration for individual characters */
        .char {
            display: inline-block;
            white-space: pre;
            animation: letterVibe 0.06s infinite ease-in-out;
        }

        @keyframes letterVibe {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            50% { transform: translate(1px, -1px) rotate(0.5deg); }
            75% { transform: translate(-1px, -1px) rotate(0deg); }
            100% { transform: translate(1px, 1px) rotate(-0.5deg); }
        }

        /* Minor delays to keep the letters moving independently but cleanly */
        .char:nth-child(2n) { animation-delay: 0.01s; animation-duration: 0.05s; }
        .char:nth-child(3n) { animation-delay: 0.02s; animation-duration: 0.07s; }
        .char:nth-child(4n) { animation-delay: 0.03s; animation-duration: 0.06s; }
    </style>
</head>
